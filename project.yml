name: PaperMon

options:
  bundleIdPrefix: com.papermon
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_HARDENED_RUNTIME: YES

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

targets:
  PaperMon:
    type: application
    platform: macOS
    sources:
      - path: PaperMon
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papermon.app
        PRODUCT_NAME: PaperMon
        MARKETING_VERSION: 1.0.2
        CURRENT_PROJECT_VERSION: 3
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Packaging/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: PaperMon
        INFOPLIST_KEY_CFBundleShortVersionString: $(MARKETING_VERSION)
        INFOPLIST_KEY_CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 PaperMon
        CODE_SIGN_ENTITLEMENTS: PaperMon/PaperMon.entitlements
    scheme:
      testTargets:
        - PaperMonTests

  PaperMonTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: PaperMonTests
    dependencies:
      - target: PaperMon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papermon.tests
        GENERATE_INFOPLIST_FILE: YES
